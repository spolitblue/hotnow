<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HotNow · 全网热榜 · 今日热榜聚合</title>
<meta name="description" content="HotNow 聚合全网实时热榜：微博热搜、知乎热榜、百度热搜、抖音、今日头条、夸克、B站、IT之家、Hacker News、豆瓣、猫眼、网易云、Epic 等。一页看完今天全网在聊什么。">
<meta name="keywords" content="今日热榜,全网热榜,热搜,热点聚合,微博热搜,知乎热榜,百度热搜,摸鱼">
<meta name="theme-color" content="#ff3b30">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6a3d'/%3E%3Cstop offset='1' stop-color='%23ff2d55'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='70' font-size='58' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== 图标精灵 ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4Z"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.6 3.2-1.6 4.6-3 6.2A7.6 7.6 0 0 0 7 13.4a5 5 0 0 0 10 0c0-2.6-1.6-4.4-1.6-4.4-.5 1.3-1.5 2-2.4 2 .9-3-1-6.7-1-9Z"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 1.9"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.4v.1"/></symbol>
</svg>

<div class="progress" id="progress"></div>

<!-- ===== 顶栏 ===== -->
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./" title="HotNow · 全网热榜">
      <div class="brand-logo">N</div>
      <div class="brand-text">
        <div class="brand-name">HotNow · 全网热榜</div>
        <div class="brand-sub" id="brandSub">一页看尽今天全网在聊什么</div>
      </div>
    </a>

    <div class="topbar-spacer"></div>

    <div class="search" id="searchWrap">
      <svg><use href="#i-search"></use></svg>
      <input id="search" type="search" placeholder="搜索热榜内容…  按 / 聚焦" autocomplete="off" spellcheck="false" aria-label="搜索热榜内容">
      <button class="search-clear" id="searchClear" type="button" title="清除搜索" aria-label="清除搜索">✕</button>
    </div>

    <div class="topbar-actions">
      <button class="btn" id="refreshBtn" type="button" title="立即刷新（R）">
        <svg id="refreshIcon"><use href="#i-refresh"></use></svg>
        <span id="refreshLabel">刷新</span>
      </button>
      <button class="btn icon" id="themeBtn" type="button" title="切换深色 / 浅色" aria-label="切换主题">
        <svg id="themeIcon"><use href="#i-moon"></use></svg>
      </button>
      <button class="btn icon" id="settingsBtn" type="button" title="设置" aria-label="设置" aria-expanded="false">
        <svg><use href="#i-settings"></use></svg>
      </button>
    </div>
  </div>
</header>

<!-- ===== 设置面板 ===== -->
<div class="sheet" id="sheet" role="dialog" aria-label="设置">
  <h3>设置</h3>
  <div class="field">
    <label for="setCount">每卡显示条数</label>
    <select id="setCount">
      <option value="10">10 条</option>
      <option value="15">15 条</option>
      <option value="20">20 条</option>
      <option value="30">30 条</option>
      <option value="50">50 条</option>
    </select>
  </div>
  <div class="field">
    <label for="setAuto">自动刷新</label>
    <select id="setAuto">
      <option value="0">关闭</option>
      <option value="300">每 5 分钟</option>
      <option value="600">每 10 分钟</option>
      <option value="1800">每 30 分钟</option>
    </select>
  </div>
  <div class="field">
    <label for="setCompact">紧凑模式</label>
    <span class="switch"><input type="checkbox" id="setCompact"><span class="track"></span></span>
  </div>
  <div class="field">
    <label for="setHideFailed">隐藏异常源</label>
    <span class="switch"><input type="checkbox" id="setHideFailed"><span class="track"></span></span>
  </div>
  <div class="field">
    <label for="setTryFlaky" title="B 站 / 小红书 / 懂车帝 / 猫眼实时等接口上游常年不稳定">加载不稳定源</label>
    <span class="switch"><input type="checkbox" id="setTryFlaky"><span class="track"></span></span>
  </div>
  <div class="field" style="margin-bottom:0">
    <label for="setOpen">条目点击</label>
    <select id="setOpen">
      <option value="modal">弹出详情</option>
      <option value="link">直接跳转原文</option>
    </select>
  </div>
</div>

<!-- ===== 主体 ===== -->
<main>
  <div class="notice" id="notice"></div>

  <section class="overview" id="overview">
    <div class="stat"><div class="stat-num" id="statSources">–</div><div class="stat-label">数据源</div></div>
    <div class="stat-divider"></div>
    <div class="stat"><div class="stat-num" id="statItems">–</div><div class="stat-label">热点条目</div></div>
    <div class="stat-divider"></div>
    <div class="stat"><div class="stat-num" id="statTopics">–</div><div class="stat-label">全网话题</div></div>
    <div class="stat-divider"></div>
    <div class="stat"><div class="stat-num" id="statTime" style="font-size:15px">–</div><div class="stat-label">最近更新</div></div>
    <div class="overview-spacer"></div>
    <div class="health" id="health"><span class="dot"></span><span>正在连接数据源…</span></div>
  </section>

  <nav class="tabs" id="tabs" role="tablist" aria-label="分类"></nav>

  <div class="keywords" id="keywords" style="display:none"></div>

  <div id="content" aria-live="polite"></div>
</main>

<footer class="foot">
  <div class="foot-row">
    <span>© <span id="year">2026</span> HotNow · 全网热榜</span>
    <span>数据来自开源项目 <a href="https://github.com/vikiboss/60s" target="_blank" rel="noopener">60s API</a>，仅供参考</span>
    <span>榜单版权归各平台所有</span>
    <span><a href="#" id="copyAll">复制全部为 Markdown</a></span>
  </div>
</footer>

<!-- ===== 详情模态框 ===== -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalSource">
    <div class="modal-head">
      <div class="card-badge" id="modalBadge">N</div>
      <div class="modal-title" id="modalSource">来源</div>
      <button class="iconbtn" id="modalClose" type="button" title="关闭（Esc）" aria-label="关闭">
        <svg><use href="#i-close"></use></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="sources.js"></script>
<script src="app.js"></script>
</body>
</html>
